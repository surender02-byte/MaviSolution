<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MaVi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 16px;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { transform: translateY(-2px); }
        .error-message {
            background: rgba(239,68,68,0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .register-link {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 14px;
        }
        .register-link a { color: #22c55e; text-decoration: none; }
        .loading { display: none; text-align: center; margin-top: 16px; color: #22c55e; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">MaVi</div>
        <div class="subtitle">Site Reliability Engineering</div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <div id="errorMsg" class="error-message"></div>
        <div id="loading" class="loading">Authenticating...</div>
        <div class="register-link">
            New user? <a href="register.html">Create account</a>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const loadingDiv = document.getElementById('loading');
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            const result = await login(email, password);
            loadingDiv.style.display = 'none';
            if (result.success) {
                if (result.role === 'ADMIN') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } else {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = result.error;
            }
        });
    </script>
</body>
</html>
