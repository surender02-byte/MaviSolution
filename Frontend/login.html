<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MaVi SRE Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }

        /* Aurora Background Effect */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .aurora {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(135deg, 
                rgba(34,197,94,0.2), 
                rgba(6,182,212,0.2), 
                rgba(139,92,246,0.1));
            filter: blur(80px);
            animation: auroraMove 15s infinite alternate;
        }

        @keyframes auroraMove {
            0% { transform: translate(-20%, -20%) rotate(0deg); }
            100% { transform: translate(20%, 20%) rotate(5deg); }
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: linear-gradient(135deg, #22c55e, #06b6d4);
            border-radius: 50%;
            opacity: 0.08;
            animation: floatParticle 20s infinite ease-in-out;
        }

        .particle:nth-child(1) { width: 300px; height: 300px; top: -150px; left: -150px; }
        .particle:nth-child(2) { width: 200px; height: 200px; bottom: -100px; right: -100px; animation-duration: 25s; }
        .particle:nth-child(3) { width: 150px; height: 150px; top: 50%; right: 5%; animation-duration: 18s; }

        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* Login Container */
        .login-container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease;
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Section */
        .logo-wrapper {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #22c55e, #06b6d4);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.3); }
            50% { box-shadow: 0 15px 35px -5px rgba(34, 197, 94, 0.5); }
        }

        .logo-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #22c55e, #06b6d4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 8px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border-radius: 14px;
            border: 1.5px solid rgba(51, 65, 85, 0.6);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }

        input:focus + i {
            color: #22c55e;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #06b6d4);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-login:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #334155, transparent);
        }

        .divider-text {
            color: #64748b;
            font-size: 12px;
        }

        /* Register Link */
        .register-link {
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .register-link a {
            color: #22c55e;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            color: #06b6d4;
        }

        /* Messages */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
            color: #22c55e;
            font-size: 13px;
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #475569;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
            .logo-icon {
                width: 55px;
                height: 55px;
            }
            .logo {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="aurora"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-container">
        <div class="logo-wrapper">
            <div class="logo-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <div class="logo">MaVi</div>
            <div class="subtitle">Site Reliability Engineering</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="Email address" required>
            </div>
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-arrow-right-to-bracket" style="margin-right: 8px;"></i>
                Sign In
            </button>
        </form>

        <div id="errorMsg" class="error-message"></div>
        <div id="loading" class="loading"><i class="fas fa-spinner"></i> Authenticating...</div>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">New to MaVi?</span>
            <div class="divider-line"></div>
        </div>

        <div class="register-link">
            <a href="register.html">Create an account</a>
        </div>

        <div class="footer-note">
            <i class="fas fa-shield-heart"></i> Secure Enterprise Login
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const loadingDiv = document.getElementById('loading');
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            const result = await login(email, password);
            loadingDiv.style.display = 'none';
            if (result.success) {
                if (result.role === 'ADMIN') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'user-dashboard.html';
                }
            } else {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ' + result.error;
            }
        });
    </script>
</body>
</html>
