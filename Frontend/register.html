<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MaVi</title>
     <link rel="icon" href="letter-m (1).png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin: 8px 0 32px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 15px;
            margin-bottom: 16px;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .error-message, .success-message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .error-message { background: rgba(239,68,68,0.2); color: #f87171; }
        .success-message { background: rgba(34,197,94,0.2); color: #22c55e; }
        .login-link { text-align: center; margin-top: 24px; color: #64748b; font-size: 14px; }
        .login-link a { color: #22c55e; text-decoration: none; }
        .loading { display: none; text-align: center; margin-top: 16px; color: #22c55e; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">MaVi</div>
        <div class="subtitle">Create your account</div>
        <form id="registerForm">
            <input type="text" id="fullname" placeholder="Full name" required>
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password (min 6 characters)" required>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            <button type="submit">Create Account</button>
        </form>
        <div id="errorMsg" class="error-message"></div>
        <div id="successMsg" class="success-message"></div>
        <div id="loading" class="loading">Creating account...</div>
        <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const loadingDiv = document.getElementById('loading');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!fullname || !email || !password) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = 'Please fill all fields';
                return;
            }
            if (password.length < 6) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = 'Password must be at least 6 characters';
                return;
            }
            if (password !== confirm) {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = 'Passwords do not match';
                return;
            }
            
            loadingDiv.style.display = 'block';
            const result = await register(fullname, email, password);
            loadingDiv.style.display = 'none';
            
            if (result.success) {
                successDiv.style.display = 'block';
                successDiv.innerHTML = 'Registration successful! Redirecting to login...';
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = result.error;
            }
        });
    </script>
</body>
</html>
